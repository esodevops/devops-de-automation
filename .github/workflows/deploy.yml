name: Infrastructure Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an apply. Shared state locking also protects local operations.
concurrency:
  group: temperature-infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_VAR_aws_region: eu-north-1
  TF_VERSION: "1.12.2"
  PYTHON_VERSION: "3.10"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  checks:
    name: Security, Tests, and Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements.txt
      - name: Security scan
        run: python -m bandit -r scripts -c .bandit
      - name: Tests and coverage
        run: python -m pytest tests/ -v --cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform initialization without backend
        run: terraform -chdir=terraform init -backend=false -lockfile=readonly
      - name: Terraform validation
        run: terraform -chdir=terraform validate
      - name: Infrastructure tests without AWS
        run: terraform -chdir=terraform test

  deploy:
    name: Plan and Deploy
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'eu-north-1' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'temperature-analysis/terraform.tfstate' }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'dml-temperature-analysis' }}
      TF_VAR_use_existing_bucket: ${{ vars.USE_EXISTING_BUCKET || 'false' }}
      TF_VAR_existing_bucket_name: ${{ vars.EXISTING_BUCKET_NAME || 'dml-temperature-analysis-raw-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Require shared state configuration
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Configure TF_STATE_BUCKET in repository or production environment variables."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Generate deployment input
        run: python scripts/generate_sample_data.py
      - name: Initialize shared state
        run: |
          terraform -chdir=terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Plan
        run: terraform -chdir=terraform plan -lock-timeout=5m -out=tfplan
      - name: Apply saved plan
        run: terraform -chdir=terraform apply -lock-timeout=5m tfplan
      - name: Export outputs
        run: terraform -chdir=terraform output -json > terraform/terraform_outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform/terraform_outputs.json
          retention-days: 7
